<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Venuebox</title>
<style>
  :root { --bg: #111318; --card: #1a1d24; --line: #2a2e38; --text: #e8e8ea; --dim: #9196a1; --accent: #f5a82b; --ok: #4cc38a; --bad: #ef6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 8px 0 4px; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text] { flex: 1; min-width: 0; background: #0c0e12; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 8px 10px; font: inherit; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { background: #2a2e38; color: var(--text); border: 1px solid #383d4a; border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  button:hover { background: #343947; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1205; font-weight: 600; }
  button.danger { color: var(--bad); }
  .msg { font-size: 12px; margin-top: 6px; min-height: 17px; color: var(--dim); }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .status { display: flex; gap: 10px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.ok { background: var(--ok); } .dot.wait { background: var(--accent); } .dot.bad { background: var(--bad); }
  .code { font-size: 34px; font-weight: 700; letter-spacing: 0.12em; color: var(--accent); font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .screen { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .screen:first-of-type { border-top: 0; }
  .screen .meta { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 14px; margin: 0; }
  .foot { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Venuebox</h1>
  <div class="sub">Each screen on this computer is a TV on the box. <span id="ver"></span></div>

  <section>
    <h2>Status</h2>
    <div class="status"><span class="dot" id="dot"></span><div><div id="statusText">…</div><div class="msg" id="statusDetail"></div></div></div>
    <div id="pairBox" hidden>
      <div class="code" id="code"></div>
      <div class="msg">On the box: <b>TVs</b> page → <b>Venuebox apps</b> → type this code.</div>
    </div>
  </section>

  <section>
    <h2>Box</h2>
    <label for="box">Box address on this network</label>
    <div class="row">
      <input type="text" id="box" placeholder="192.168.1.20" spellcheck="false">
      <button id="test">Test</button>
      <button class="primary" id="save">Save</button>
    </div>
    <div class="msg" id="boxMsg"></div>
    <label for="name">Name for this computer (sent when pairing)</label>
    <div class="row">
      <input type="text" id="name" spellcheck="false" maxlength="60">
      <button id="saveName">Save</button>
    </div>
    <div class="msg" id="nameMsg"></div>
  </section>

  <section>
    <h2>Screens</h2>
    <div id="screens"></div>
  </section>

  <section>
    <h2>This computer</h2>
    <label class="check"><input type="checkbox" id="login"> Start Venuebox when this computer starts</label>
    <div class="row" style="margin-top:12px">
      <button class="danger" id="unpair">Unpair from the box</button>
      <button class="danger" id="quit">Quit Venuebox</button>
    </div>
    <div class="msg">Open this window any time: Ctrl+Alt+Shift+V, or the tray icon.</div>
  </section>
<script src="settings.js"></script>
</body>
</html>
